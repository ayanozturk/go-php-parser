name: Security fuzz smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  parser-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz malformed parser input
        run: go test ./parser -run='^$' -fuzz='^FuzzParserMalformedPHP$' -fuzztime=15s
      - name: Fuzz parser cancellation
        run: go test ./parser -run='^$' -fuzz='^FuzzParserCancellation$' -fuzztime=10s
